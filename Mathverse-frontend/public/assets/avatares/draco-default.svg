<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="defGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a45"/>
      <stop offset="50%" stop-color="#f5222d"/>
      <stop offset="100%" stop-color="#cf1322"/>
    </linearGradient>
    <linearGradient id="bellyGradD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe58f"/>
      <stop offset="100%" stop-color="#ffd666"/>
    </linearGradient>
  </defs>

  <!-- Aura -->
  <circle cx="100" cy="100" r="92" fill="url(#defGlow)"/>

  <!-- Wings -->
  <path d="M48 95 C25 70 20 115 50 120 Z" fill="#cf1322" stroke="#fff" stroke-width="2"/>
  <path d="M152 95 C175 70 180 115 150 120 Z" fill="#cf1322" stroke="#fff" stroke-width="2"/>

  <!-- Tail with Spikes -->
  <path d="M140 145 C170 150 180 170 165 175 C150 175 140 160 135 150 Z" fill="#f5222d"/>
  <polygon points="170,165 178,172 166,177" fill="#ffd666"/>

  <!-- Body -->
  <ellipse cx="100" cy="130" rx="42" ry="40" fill="url(#bodyGradD)" stroke="#fff" stroke-width="2.5"/>
  <!-- Belly -->
  <ellipse cx="100" cy="135" rx="26" ry="26" fill="url(#bellyGradD)"/>
  <line x1="82" y1="126" x2="118" y2="126" stroke="#d48806" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="136" x2="120" y2="136" stroke="#d48806" stroke-width="2" stroke-linecap="round"/>
  <line x1="84" y1="146" x2="116" y2="146" stroke="#d48806" stroke-width="2" stroke-linecap="round"/>

  <!-- Feet -->
  <ellipse cx="78" cy="168" rx="14" ry="9" fill="#ff7a45" stroke="#fff" stroke-width="2"/>
  <ellipse cx="122" cy="168" rx="14" ry="9" fill="#ff7a45" stroke="#fff" stroke-width="2"/>

  <!-- Horns -->
  <polygon points="76,52 68,30 84,46" fill="#ffd666" stroke="#d48806" stroke-width="1.5"/>
  <polygon points="124,52 132,30 116,46" fill="#ffd666" stroke="#d48806" stroke-width="1.5"/>

  <!-- Head -->
  <circle cx="100" cy="80" r="38" fill="url(#bodyGradD)" stroke="#fff" stroke-width="2.5"/>

  <!-- Snout / Cheeks -->
  <ellipse cx="100" cy="94" rx="20" ry="12" fill="#ff9c6e"/>
  <ellipse cx="74" cy="88" rx="7" ry="4" fill="#ff4d4f" opacity="0.5"/>
  <ellipse cx="126" cy="88" rx="7" ry="4" fill="#ff4d4f" opacity="0.5"/>
  <circle cx="95" cy="92" r="1.5" fill="#5c0011"/>
  <circle cx="105" cy="92" r="1.5" fill="#5c0011"/>
  <path d="M94 98 Q100 103 106 98" fill="none" stroke="#5c0011" stroke-width="2" stroke-linecap="round"/>

  <!-- Big Kids Cartoon Eyes -->
  <ellipse cx="86" cy="74" rx="9" ry="12" fill="#fff"/>
  <ellipse cx="114" cy="74" rx="9" ry="12" fill="#fff"/>
  <circle cx="88" cy="74" r="6" fill="#1f1f1f"/>
  <circle cx="112" cy="74" r="6" fill="#1f1f1f"/>
  <circle cx="86" cy="71" r="2.5" fill="#fff"/>
  <circle cx="110" cy="71" r="2.5" fill="#fff"/>

  <!-- Hands -->
  <ellipse cx="64" cy="130" rx="9" ry="7" fill="#ff7a45"/>
  <ellipse cx="136" cy="130" rx="9" ry="7" fill="#ff7a45"/>
</svg>
