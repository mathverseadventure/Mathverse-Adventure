<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="sorcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#9333ea" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f472b6"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <linearGradient id="bodyGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a45"/>
      <stop offset="50%" stop-color="#f5222d"/>
      <stop offset="100%" stop-color="#cf1322"/>
    </linearGradient>
    <linearGradient id="cowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a044e"/>
      <stop offset="50%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
  </defs>

  <!-- Mystical Arcane Aura -->
  <circle cx="100" cy="100" r="94" fill="url(#sorcGlow)"/>

  <!-- Mystic Runes Orbiting -->
  <g stroke="#f472b6" stroke-width="1.5" fill="none" opacity="0.8">
    <circle cx="100" cy="100" r="88" stroke-dasharray="4,8"/>
    <!-- Small Rune Symbols -->
    <text x="32" y="60" font-family="monospace" font-size="12" fill="#c084fc" font-weight="bold">∑</text>
    <text x="160" y="70" font-family="monospace" font-size="12" fill="#f472b6" font-weight="bold">∞</text>
    <text x="25" y="140" font-family="monospace" font-size="12" fill="#f472b6" font-weight="bold">π</text>
    <text x="165" y="135" font-family="monospace" font-size="12" fill="#c084fc" font-weight="bold">√</text>
  </g>

  <!-- Wings -->
  <path d="M48 95 C25 70 20 115 50 120 Z" fill="#cf1322" stroke="#fff" stroke-width="2"/>
  <path d="M152 95 C175 70 180 115 150 120 Z" fill="#cf1322" stroke="#fff" stroke-width="2"/>

  <!-- Tail -->
  <path d="M140 145 C170 150 180 170 165 175 C150 175 140 160 135 150 Z" fill="#f5222d"/>
  <polygon points="170,165 178,172 166,177" fill="#f472b6"/>

  <!-- Body -->
  <ellipse cx="100" cy="130" rx="42" ry="40" fill="url(#bodyGradH)" stroke="#fff" stroke-width="2.5"/>

  <!-- Sorcerer Robe -->
  <path d="M68 114 Q100 122 132 114 L126 156 Q100 165 74 156 Z" fill="url(#cowlGrad)" stroke="#c084fc" stroke-width="1.5"/>

  <!-- Feet -->
  <ellipse cx="78" cy="168" rx="14" ry="9" fill="#ff7a45" stroke="#fff" stroke-width="2"/>
  <ellipse cx="122" cy="168" rx="14" ry="9" fill="#ff7a45" stroke="#fff" stroke-width="2"/>

  <!-- Head -->
  <circle cx="100" cy="80" r="38" fill="url(#bodyGradH)" stroke="#fff" stroke-width="2.5"/>

  <!-- Snout / Cheeks -->
  <ellipse cx="100" cy="94" rx="20" ry="12" fill="#ff9c6e"/>
  <ellipse cx="74" cy="88" rx="7" ry="4" fill="#ff4d4f" opacity="0.5"/>
  <ellipse cx="126" cy="88" rx="7" ry="4" fill="#ff4d4f" opacity="0.5"/>
  <circle cx="95" cy="92" r="1.5" fill="#5c0011"/>
  <circle cx="105" cy="92" r="1.5" fill="#5c0011"/>
  <path d="M94 98 Q100 102 106 98" fill="none" stroke="#5c0011" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyes - Glowing Magenta Arcane Eyes -->
  <ellipse cx="86" cy="74" rx="9" ry="12" fill="#fff"/>
  <ellipse cx="114" cy="74" rx="9" ry="12" fill="#fff"/>
  <circle cx="88" cy="74" r="6" fill="#701a75"/>
  <circle cx="112" cy="74" r="6" fill="#701a75"/>
  <circle cx="88" cy="74" r="3" fill="#f472b6"/>
  <circle cx="112" cy="74" r="3" fill="#f472b6"/>
  <circle cx="86" cy="71" r="1.8" fill="#fff"/>
  <circle cx="110" cy="71" r="1.8" fill="#fff"/>

  <!-- Sorcerer Hood / Cowl -->
  <path d="M58 84 C56 42 70 24 100 20 C130 24 144 42 142 84 C134 50 120 46 100 46 C80 46 66 50 58 84 Z" fill="url(#cowlGrad)" stroke="#e879f9" stroke-width="2"/>
  <!-- Pointed hood tip -->
  <path d="M88 24 Q100 12 110 8 Q106 20 112 24 Z" fill="#4a044e"/>

  <!-- Forehead Arcane Gem -->
  <polygon points="100,38 105,44 100,50 95,44" fill="#f472b6" stroke="#fff" stroke-width="1"/>

  <!-- Hands -->
  <ellipse cx="64" cy="130" rx="9" ry="7" fill="#ff7a45"/>
  <ellipse cx="136" cy="130" rx="9" ry="7" fill="#ff7a45"/>

  <!-- Floating Arcane Crystal Orb (Center/Right) -->
  <g transform="translate(132, 126)">
    <!-- Aura around orb -->
    <circle cx="0" cy="0" r="22" fill="#c084fc" opacity="0.35"/>
    <!-- Crystal Orb -->
    <circle cx="0" cy="0" r="16" fill="url(#orbGlow)" stroke="#fff" stroke-width="2"/>
    <!-- Internal arcane core -->
    <circle cx="-4" cy="-4" r="4" fill="#fff" opacity="0.8"/>
    <!-- Energy Rings -->
    <ellipse cx="0" cy="0" rx="20" ry="7" fill="none" stroke="#f472b6" stroke-width="1.5" transform="rotate(25)"/>
  </g>
</svg>
